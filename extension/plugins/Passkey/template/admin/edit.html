<header>
	<div>
		@include("/admin/topicpath.html")
	</div>
	<div>
		<h1 class="acms-admin-admin-title js-dialog-title">
			<!--T--><span class="js-dialog-title">パスキー管理</span><!--/T-->
		</h1>
	</div>
</header>

<div class="acms-admin-form-group js-acms_fix_marker acms_fix_bg">
	<div class="acms_fix_bg_index">
		<a href="%{HTTP_ROOT}bid/%{BID}/admin/app_passkey_index/" class="acms-admin-btn-admin">
			<!--T-->戻る<!--/T-->
		</a>
		<button type="button" id="js-acms-passkey-register" class="acms-admin-btn acms-admin-btn-primary acms-admin-btn-save js-saving-splash" data-redirect="%{HTTP_ROOT}bid/%{BID}/admin/app_passkey_index/">
			<!--T-->パスキーを追加<!--/T-->
		</button>
	</div>
</div>
<p id="js-acms-passkey-message" class="acms-admin-margin-top-mini" style="color:#c00;"></p>

<div class="acms-admin-panel">
  <div class="acms-admin-panel-header">
    <h3 class="acms-admin-panel-title">パスキーの登録について</h3>
  </div>
  <div class="acms-admin-panel-body">
    <ol>
      <li>登録したいパスキーの名前を入力して「パスキーを追加」を押してください。</li>
      <li>ブラウザがお使いの認証器（Touch ID / Face ID / Windows Hello / Android の生体認証や画面ロック / ハードウェアセキュリティキーなど）に登録を求めます。</li>
    </ol>
  </div>
</div>

<table class="adminTable acms-admin-table-admin-edit acms-admin-form">
	<tbody>
		<tr>
			<th>
				<label for="js-acms-passkey-nickname"><!--T-->名前<!--/T--></label>
				<i class="acms-admin-icon-tooltip js-acms-tooltip-hover" data-acms-tooltip="<!--T-->登録するパスキーを区別する名前です。例: iPhone / 自宅 PC<!--/T-->"></i>
			</th>
			<td>
				<input type="text" id="js-acms-passkey-nickname" maxlength="64" placeholder="例: iPhone / 自宅 PC" class="acms-admin-form-width-medium" required />
			</td>
		</tr>
	</tbody>
</table>

<script src="/extension/plugins/Passkey/bundle/passkey-manage.js?v=7" defer></script>
